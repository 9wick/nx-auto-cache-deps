# プラットフォームごとにトレーサーをビルドし、統合テストを通したうえでバイナリをアップロードする。
name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # id は src/platform.ts の PLATFORMS と一致させる
      matrix:
        include:
          - id: linux-x64-gnu
            runner: ubuntu-24.04
          - id: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - id: darwin-arm64
            runner: macos-15
          - id: darwin-x64
            runner: macos-15-intel
          - id: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain from native/rust-toolchain.toml
        working-directory: native
        run: rustup toolchain install
      - run: pnpm typecheck
      - run: pnpm test
      # artifact は実行権限を保たないため、tar に包んで渡す
      - name: Archive tracer binary
        run: tar -cf "tracer-${{ matrix.id }}.tar" "bin/${{ matrix.id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracer-${{ matrix.id }}
          path: tracer-${{ matrix.id }}.tar
          if-no-files-found: error

  build-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JavaScript actions はホスト側で実行し、ビルド・検証は musl の Node.js で行う。
      - name: Build and test on Alpine Linux
        run: |
          docker run --rm --shm-size=256m --security-opt seccomp=unconfined \
            -e CI=true -v "$PWD:/workspace" -w /workspace \
            node:24.22.2-alpine3.23 sh scripts/ci-musl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracer-linux-x64-musl
          path: tracer-linux-x64-musl.tar
          if-no-files-found: error
