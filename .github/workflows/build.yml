# プラットフォームごとにトレーサーをビルドし、統合テストを通したうえで OS 別パッケージの tarball を作る。
name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # id は src/platform.ts の PLATFORMS と一致させる
      matrix:
        include:
          - id: linux-x64-gnu
            runner: ubuntu-24.04
          - id: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - id: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain from native/rust-toolchain.toml
        working-directory: native
        run: rustup toolchain install
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack platform package
        run: |
          mkdir -p .tmp/release
          npm pack "$(node scripts/pack-platform.mjs ${{ matrix.id }})" --pack-destination .tmp/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-${{ matrix.id }}
          path: .tmp/release/*.tgz
          if-no-files-found: error
