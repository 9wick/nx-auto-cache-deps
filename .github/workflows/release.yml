# v<version> タグの push で、全プラットフォームのトレーサーを同梱して npm に公開する。
# 認証は npm の Trusted Publishing (OIDC)。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm CLI 11.5.1 以上が必要。Node.js 24.22.2 には npm 11.19.1 が同梱されている
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tracer-*
          path: .tmp/tracers
          merge-multiple: true
      - run: for archive in .tmp/tracers/*.tar; do tar -xf "$archive"; done
      # タグとバージョンの不一致やバイナリの欠けは、公開する前に止める
      - run: node scripts/prepare-release.mjs "${{ github.ref_name }}"
      - run: npm publish --access public
